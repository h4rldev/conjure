# Build release binaries and attach them to the release on both hosts.
#
# Triggered by the `v*` tag that cut.yml pushes to Codeberg and the push-mirror
# propagates here, or manually for an existing tag. Builds Linux (gnu), macOS
# (x86_64 + arm64), and Windows (both the MSVC and the MinGW/GNU ABIs), then a
# publish job packages them with checksums, creates the GitHub release with the
# notes carried on the annotated tag, and mirrors the assets onto the matching
# Codeberg release (creating it as a draft if it does not exist).
#
# A `crates` job also publishes the source to crates.io under the name
# `conjure-build` (the bare `conjure` name is taken and never freed). It uses
# crates.io trusted publishing, so no token secret is stored; this workflow file
# must be listed as a trusted publisher in the crate's crates.io settings.
# Trusted publishing can only be configured once the crate exists, so the first
# release must be published by hand (`cargo publish`).
#
# Requires `CODEBERG_TOKEN` (write access to the Codeberg repo), `GPG_PRIVATE_KEY`
# (armored private signing key), and `GPG_PASSPHRASE` (its passphrase). The GPG
# key signs SHA256SUMS so packagers can authenticate the artifacts against a
# fingerprint instead of trusting the download host alone.

name: Release Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build and publish"
        type: string
        required: true
      draft:
        description: "Create the releases as drafts so they can be edited before publishing (tag pushes always draft)"
        type: boolean
        default: true

permissions:
  contents: write

env:
  CODEBERG_REPO: h4rl/conjure

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: x86_64-pc-windows-gnu
            msys: true
          - os: macos-15-intel
            target: x86_64-apple-darwin
            openssl_dir: /usr/local/opt/openssl@3
          - os: macos-15
            target: aarch64-apple-darwin
            openssl_dir: /opt/homebrew/opt/openssl@3
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      # git2 pulls libgit2 + libssh2 (both vendored by their -sys crates) and
      # openssl (from the system, hence the per-OS installs below).
      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config

      - name: Install deps (macOS)
        if: runner.os == 'macOS'
        run: brew install openssl@3

      # Homebrew's openssl@3 is keg-only, so point openssl-sys at it. Do this
      # via GITHUB_ENV only for macOS: a bare `env: OPENSSL_DIR: ${{ matrix.openssl_dir }}`
      # sets the variable to an empty string on Linux/Windows, and openssl-sys
      # treats a set-but-empty OPENSSL_DIR as a relative path and panics.
      - name: Configure OpenSSL (macOS)
        if: runner.os == 'macOS'
        run: echo "OPENSSL_DIR=${{ matrix.openssl_dir }}" >> "$GITHUB_ENV"

      - name: Install deps (Windows MSVC)
        if: runner.os == 'Windows' && !matrix.msys
        shell: pwsh
        run: |
          # Static OpenSSL from vcpkg, release-only. The default `x64-windows`
          # triplet is dynamic, which put libssl-3-x64.dll/libcrypto-3-x64.dll
          # requirements on the exe that the release zip does not carry, and it
          # built both -dbg and -rel ports (wasted time; vcpkg-rs only ever reads
          # the release libs). `x64-windows-static-md-release` fixes both: static
          # library linkage, dynamic CRT (matches Rust's default), release-only.
          # `VCPKGRS_TRIPLET` makes openssl-sys and the install agree; no
          # `VCPKGRS_DYNAMIC` (it is presence-based, so `=0` forces dynamic).
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install openssl:x64-windows-static-md-release
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
          "VCPKGRS_TRIPLET=x64-windows-static-md-release" >> $env:GITHUB_ENV
          # libgit2's https uses vcpkg openssl: openssl-sys finds it via vcpkg's
          # find_package, which reads port metadata and so handles OpenSSL 3's
          # version-suffixed DLLs. libssh2-sys instead probes for a hardcoded
          # version-less `libssl`/`libcrypto` pair including `libssl.dll`, which
          # vcpkg's OpenSSL 3 does not ship (`libssl-3-x64.dll`), so its vcpkg
          # path always panics. Disable it; libssh2-sys then builds vendored and
          # uses Windows CNG for ssh (no OpenSSL needed there).
          "VCPKGRS_NO_LIBSSH2=1" >> $env:GITHUB_ENV

      - uses: msys2/setup-msys2@v2
        if: matrix.msys
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-pkgconf

      - name: Build
        if: ${{ !matrix.msys }}
        run: |
          rustup target add "${{ matrix.target }}"
          cargo build --release --target "${{ matrix.target }}"

      - name: Build (MSYS2)
        if: matrix.msys
        shell: msys2 {0}
        env:
          OPENSSL_DIR: /mingw64
          # MSYS2 ships both the import libs (libssl.dll.a) and the static ones
          # (libssl.a); force static so no libssl-3-x64.dll/libcrypto-3-x64.dll
          # is needed at runtime. libz-sys already builds zlib from source on
          # pc-windows-gnu, so the zlib symbols resolve too.
          OPENSSL_STATIC: "1"
          # Statically link libgcc_eh/winpthread instead of depending on
          # libgcc_s_seh-1.dll / libwinpthread-1.dll, which are absent on a
          # clean Windows machine.
          RUSTFLAGS: "-C target-feature=+crt-static"
        run: |
          export PATH="$(cygpath "$USERPROFILE")/.cargo/bin:$PATH"
          rustup target add "${{ matrix.target }}"
          cargo build --release --target "${{ matrix.target }}"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: target/${{ matrix.target }}/release/conjure*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CB_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
    steps:
      # For the tag annotation that carries the release notes.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          path: raw

      - name: Package and checksum
        run: |
          set -euo pipefail
          version="${TAG#v}"
          mkdir -p dist
          for dir in raw/*/; do
            target="$(basename "$dir")"
            base="conjure-${version}-${target}"
            if [[ "$target" == *windows* ]]; then
              # The uploaded artifact is the whole `conjure*` glob, which also
              # matches the `.d` depfile and a `.pdb`, so pick the executable by
              # name; an arbitrary `find | head -n1` once shipped a depfile.
              bin="$(find "$dir" -type f -iname 'conjure.exe' | head -n1)"
              [ -n "$bin" ] || { echo "no conjure.exe in $dir" >&2; exit 1; }
              cp "$bin" "dist/${base}.exe"
              (cd dist && zip -q "${base}.zip" "${base}.exe" && rm "${base}.exe")
            else
              bin="$(find "$dir" -type f -name 'conjure' | head -n1)"
              [ -n "$bin" ] || { echo "no conjure binary in $dir" >&2; exit 1; }
              cp "$bin" "dist/${base}"
              tar -czf "dist/${base}.tar.gz" -C dist "${base}"
              rm "dist/${base}"
            fi
          done
          # Bare filenames, so `sha256sum -c SHA256SUMS` works from the directory
          # the assets were downloaded into. `sha256sum dist/*` would record the
          # `dist/` prefix and fail verification.
          (cd dist && sha256sum -- *.tar.gz *.zip > SHA256SUMS)
          ls -l dist

      - name: Sign checksums with GPG
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          export GNUPGHOME="$(mktemp -d)"
          chmod 700 "$GNUPGHOME"

          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import

          fingerprint="$(gpg --batch --list-secret-keys --with-colons \
            | awk -F: '/^fpr:/ { print $10; exit }')"
          if [ -z "$fingerprint" ]; then
            echo "no secret key found in GPG_PRIVATE_KEY" >&2
            exit 1
          fi
          echo "signing with $fingerprint"

          # Detached armored signature over the manifest. A packager putting
          # `SHA256SUMS.asc` in `source` and this fingerprint in `validpgpkeys`
          # lets `makepkg` verify the artifacts even if the download host or the
          # PKGBUILD checksums are later changed.
          (cd dist && gpg --batch --yes --pinentry-mode loopback \
            --passphrase "$GPG_PASSPHRASE" \
            --local-user "$fingerprint" \
            --armor --detach-sign --output SHA256SUMS.asc SHA256SUMS)

          # Ship the public half too, so users import the exact signing key
          # rather than trusting a keyserver lookup.
          gpg --batch --armor --export "$fingerprint" > dist/conjure-signing-key.asc

          gpg --batch --verify dist/SHA256SUMS.asc dist/SHA256SUMS
          ls -l dist

      - name: Extract release notes
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          msg="$(git tag -l --format='%(contents)' "$TAG")"
          : > gh-notes.md
          : > cb-notes.md
          if printf '%s\n' "$msg" | grep -q 'conjure:github'; then
            printf '%s\n' "$msg" \
              | awk '/conjure:github/{f=1; next} /conjure:codeberg/{f=0} f' > gh-notes.md
            printf '%s\n' "$msg" | awk '/conjure:codeberg/{f=1; next} f' > cb-notes.md
          else
            printf '%s\n' "$msg" > gh-notes.md
            printf '%s\n' "$msg" > cb-notes.md
          fi
          # A hand-pushed lightweight tag has no annotation; Codeberg falls back
          # to the GitHub body below.
          [ -s cb-notes.md ] || cp gh-notes.md cb-notes.md
          echo "--- github ---"; cat gh-notes.md; echo
          echo "--- codeberg ---"; cat cb-notes.md

      - name: Create or update GitHub release
        env:
          DRAFT_INPUT: ${{ inputs.draft }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            # An earlier (possibly aborted) run may have created the release with
            # stale notes. Re-apply the generated body before re-uploading.
            if [ -s gh-notes.md ]; then
              gh release edit "$TAG" --title "$TAG" --notes-file gh-notes.md
            fi
            gh release upload "$TAG" dist/* --clobber
            exit 0
          fi
          if [ -s gh-notes.md ]; then
            args=(--notes-file gh-notes.md)
          else
            args=(--generate-notes)
          fi
          # Tag pushes (the normal path) default to a draft; a manual dispatch
          # may pass draft=false.
          draft="$DRAFT_INPUT"
          [ -z "$draft" ] && draft=true
          if [ "$draft" = "true" ]; then args+=(--draft); fi
          gh release create "$TAG" --title "$TAG" "${args[@]}" dist/*

      - name: Mirror assets to the Codeberg release
        env:
          DRAFT_INPUT: ${{ inputs.draft }}
        run: |
          set -euo pipefail
          api="https://codeberg.org/api/v1/repos/${CODEBERG_REPO}/releases"

          # Match the GitHub release's draft state: tag pushes (no input) draft.
          draft="true"
          if [ "${DRAFT_INPUT:-}" = "false" ]; then draft="false"; fi

          # Find the release by tag. The list endpoint is used rather than
          # /tags/ so a draft release is found.
          find_id() {
            curl -fsS -H "Authorization: token ${CB_TOKEN}" "${api}?limit=100" \
              | jq -r --arg t "$TAG" '.[] | select(.tag_name == $t) | .id' \
              | head -n1
          }

          rid="$(find_id || true)"
          if [ -z "$rid" ] || [ "$rid" = "null" ]; then
            jq -n --arg t "$TAG" --rawfile b cb-notes.md --argjson draft "$draft" \
              '{tag_name: $t, name: $t, body: $b, draft: $draft, prerelease: false}' \
              | curl -fsS -X POST \
                  -H "Authorization: token ${CB_TOKEN}" \
                  -H "Content-Type: application/json" \
                  -d @- "${api}"
            rid="$(find_id)"
          else
            # Re-apply the body on an existing release; a prior partial run may
            # have left stale notes. Omitting `draft` preserves its state, so a
            # re-run never un-publishes or re-drafts a release.
            jq -n --arg t "$TAG" --rawfile b cb-notes.md \
              '{tag_name: $t, name: $t, body: $b}' \
              | curl -fsS -X PATCH \
                  -H "Authorization: token ${CB_TOKEN}" \
                  -H "Content-Type: application/json" \
                  -d @- "${api}/${rid}"
          fi

          # Assets of the same name cannot be uploaded twice, and re-runs are
          # expected, so drop any existing matches first.
          existing="$(curl -fsS -H "Authorization: token ${CB_TOKEN}" \
            "${api}/${rid}/assets" 2>/dev/null || true)"
          for f in dist/*; do
            name="$(basename "$f")"
            old="$(printf '%s\n' "$existing" \
              | jq -r --arg n "$name" '.[] | select(.name == $n) | .id' 2>/dev/null \
              | head -n1)"
            if [ -n "$old" ] && [ "$old" != "null" ]; then
              curl -fsS -X DELETE -H "Authorization: token ${CB_TOKEN}" \
                "${api}/${rid}/assets/${old}" >/dev/null
            fi
            curl -fsS -X POST \
              -H "Authorization: token ${CB_TOKEN}" \
              -F "attachment=@$f" \
              "${api}/${rid}/assets?name=${name}"
          done

  crates:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      # `cargo publish` is irreversible, so a re-run (or a manual dispatch of an
      # already-released tag) must not try to republish. crates.io exposes a
      # version endpoint that 404s until the version exists.
      - name: Check whether this version is already published
        id: check
        run: |
          set -euo pipefail
          name="$(sed -n 's/^name = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          if curl -fsS -A "conjure-release" \
            "https://crates.io/api/v1/crates/${name}/${version}" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "${name} ${version} is already on crates.io; skipping"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "will publish ${name} ${version}"
          fi

      - name: Authenticate with crates.io
        if: steps.check.outputs.publish == 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: cargo publish
        if: steps.check.outputs.publish == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked
