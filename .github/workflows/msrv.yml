# Guard the declared MSRV in Cargo.toml (`rust-version`).
#
# Runs on pushes and PRs to keep the floor honest: if a change or a dependency
# bump needs a newer rustc, this fails and the `rust-version` field must be
# raised deliberately rather than drifting silently.

name: MSRV

on:
  push:
    branches: [main, master]
    paths: ["Cargo.toml", "Cargo.lock", "src/**", ".github/workflows/msrv.yml"]
  pull_request:
    paths: ["Cargo.toml", "Cargo.lock", "src/**"]
  workflow_dispatch:

jobs:
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.95.0

      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config

      - name: Check
        run: cargo build --locked
