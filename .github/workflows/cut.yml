# Cut a release: bump the version, annotate a tag with the generated notes, and
# push both to Codeberg (canonical). Codeberg push-mirrors to GitHub, which then
# triggers release.yml to build and publish.
#
# Nothing is ever pushed to GitHub from here; GitHub only ever receives refs via
# the Codeberg mirror.
#
# Requires a repository secret `CODEBERG_TOKEN`: a Forgejo token with write
# access to CODEBERG_REPO.

name: Cut Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "How to bump the current version"
        type: choice
        options:
          - patch
          - minor
          - major
          - custom
        default: patch
      version:
        description: "Explicit version without leading v (only used when bump=custom)"
        type: string
        required: false
      notes:
        description: "Intro/highlights prose shown under the title (optional)"
        type: string
        required: false
      dry_run:
        description: "Compute and print the version and notes, but do not commit, tag, or push"
        type: boolean
        default: false

permissions:
  contents: read

env:
  CODEBERG_REPO: h4rl/conjure

jobs:
  cut:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "conjure-release"
          git config user.email "release@conjure.invalid"

      - name: Compute next version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          REQUESTED: ${{ inputs.version }}
        run: |
          set -euo pipefail
          current="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          if [ -z "$current" ]; then
            echo "could not read version from Cargo.toml" >&2
            exit 1
          fi

          IFS=. read -r major minor patch <<< "$current"
          case "$BUMP" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
            custom)
              if ! printf '%s' "$REQUESTED" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
                echo "bump=custom needs a version like 1.2.3 (got '$REQUESTED')" >&2
                exit 1
              fi
              major="${REQUESTED%%.*}"
              rest="${REQUESTED#*.}"
              minor="${rest%%.*}"
              patch="${rest#*.}"
              ;;
          esac
          next="${major}.${minor}.${patch}"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "tag=v${next}" >> "$GITHUB_OUTPUT"
          echo "bumping $current -> $next"

      - name: Generate release notes
        id: notes
        env:
          TAG: ${{ steps.version.outputs.tag }}
          PREAMBLE: ${{ inputs.notes }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Map git author email -> Codeberg @login so Codeberg releases can
          # mention authors. Best-effort: an unlinked email falls back to
          # `Name <email>`, which is also the only form used on GitHub.
          cb_map="$(curl -fsS \
            "https://codeberg.org/api/v1/repos/${CODEBERG_REPO}/commits?limit=200" \
            2>/dev/null \
            | jq -r '.[] | select(.author != null)
                | "\(.commit.author.email | ascii_downcase)\t@\(.author.login)"' \
            2>/dev/null || true)"
          cb_handle() { # $1 email -> "@login" or empty
            printf '%s\n' "$cb_map" | awk -F'\t' \
              -v e="$(printf '%s' "$1" | tr '[:upper:]' '[:lower:]')" \
              '$1 == e { print $2; exit }'
          }
          cb_author() { # $1 name, $2 email
            local h; h="$(cb_handle "$2")"
            if [ -n "$h" ]; then printf '%s' "$h"; else printf '%s <%s>' "$1" "$2"; fi
          }
          cb_from_line() { # "Name <email>" -> "@login" or unchanged
            local email h; email="$(printf '%s' "$1" | sed -n 's/.*<\(.*\)>.*/\1/p')"
            h="$(cb_handle "$email")"
            if [ -n "$h" ]; then printf '%s' "$h"; else printf '%s' "$1"; fi
          }

          # People with write access to the repo are maintainers, not
          # contributors, so they are never listed as "new". Prefer the API so
          # added collaborators are covered; always drop the repo owner, and
          # fall back to just the owner + bots if the API is unavailable.
          mkeys="$(printf '%s' "${GITHUB_REPOSITORY_OWNER:-}" | tr '[:upper:]' '[:lower:]')"
          collab="$(gh api \
            "repos/${GITHUB_REPOSITORY}/collaborators?affiliation=all&per_page=100" \
            --jq '.[] | select(.permissions.push) | [.login, (.name // ""), (.email // "")] | @tsv' \
            2>/dev/null || true)"
          if [ -n "$collab" ]; then
            extra="$(printf '%s\n' "$collab" | awk -F'\t' '{
              print $1
              if ($2 != "") print $2
              if ($3 != "") print $3
              at = index($3, "@")
              if (at > 1) print substr($3, 1, at - 1)
            }' | tr '[:upper:]' '[:lower:]')"
            mkeys="$(printf '%s\n%s' "$mkeys" "$extra")"
          fi
          mkeys="$(printf '%s\n' "$mkeys" | sed '/^$/d' | sort -u)"

          # Match a commit identity to a maintainer by name, email, or the
          # local part of the email (git author names rarely equal a login, so
          # this is a heuristic; bots always excluded).
          is_maintainer() {
            local name email elocal
            name="$(printf '%s' "$1" | tr '[:upper:]' '[:lower:]')"
            email="$(printf '%s' "$2" | tr '[:upper:]' '[:lower:]')"
            elocal="${email%@*}"
            case "$name" in *"[bot]") return 0 ;; esac
            printf '%s\n' "$mkeys" | grep -qxF "$name" && return 0
            printf '%s\n' "$mkeys" | grep -qxF "$email" && return 0
            printf '%s\n' "$mkeys" | grep -qxF "$elocal" && return 0
            return 1
          }

          # Unique `Name <email>` of non-maintainers reachable from a rev.
          # `git log --pretty=format:` has no trailing newline, so the final
          # (oldest) record needs the `|| [ -n "$name" ]` guard or `read` drops
          # it as unterminated.
          authors_since() {
            if [ -n "$1" ]; then
              git log "$1" --pretty=format:'%aN%x1f%aE'
            else
              git log --pretty=format:'%aN%x1f%aE'
            fi | while IFS=$'\x1f' read -r name email || [ -n "$name" ]; do
              is_maintainer "$name" "$email" && continue
              printf '%s <%s>\n' "$name" "$email"
            done | sort -u
          }

          prev="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [ -n "$prev" ]; then
            range="${prev}..HEAD"
            all="$(git log "$range" --pretty=format:'%s%x1f%aN%x1f%aE')"
            new_contributors="$(comm -23 <(authors_since "$range") <(authors_since "$prev"))"
          else
            all="$(git log --pretty=format:'%s%x1f%aN%x1f%aE')"
            new_contributors="$(authors_since "")"
          fi

          # Bucket conventional-commit subjects, keeping each commit's author so
          # the changelog can attribute entries. TSV columns:
          # type, description, GitHub author, Codeberg author.
          : > entries.tsv
          while IFS=$'\x1f' read -r subject name email; do
            [ -z "$subject" ] && continue
            type="$(printf '%s' "$subject" \
              | sed -nE 's/^([A-Za-z]+)(\([^)]*\))?!?:.*/\1/p' | tr '[:upper:]' '[:lower:]')"
            desc="$(printf '%s' "$subject" \
              | sed -E 's/^[A-Za-z]+(\([^)]*\))?!?:[[:space:]]*//' \
              | sed 's/^./\U&/')"
            printf '%s\t%s\t%s <%s>\t%s\n' \
              "$type" "$desc" "$name" "$email" "$(cb_author "$name" "$email")" \
              >> entries.tsv
          done <<< "$all"

          # $1 is "gh" or "cb"; pick the matching author column.
          render_changelog() {
            local t label matches
            for t in feat fix docs other; do
              case "$t" in
                feat)  label="Features" ;;
                fix)   label="Bug Fixes" ;;
                docs)  label="Documentation" ;;
                other) label="Other Changes" ;;
              esac
              matches="$(awk -F'\t' -v t="$t" '$1 == t' entries.tsv || true)"
              [ -z "$matches" ] && continue
              echo "### ${label}"
              echo
              if [ "$1" = cb ]; then
                printf '%s\n' "$matches" | awk -F'\t' '{ print "- " $2 " by " $4 }'
              else
                printf '%s\n' "$matches" | awk -F'\t' '{ print "- " $2 " by " $3 }'
              fi
              echo
            done
          }

          emit_body() { # $1 is "gh" or "cb"
            echo "# Conjure ${TAG}"
            echo
            if [ -n "$PREAMBLE" ]; then
              printf '%s\n\n' "$PREAMBLE"
            fi
            echo "## What's Changed"
            echo
            render_changelog "$1"
            if [ -n "$new_contributors" ]; then
              echo "## New Contributors"
              echo
              while IFS= read -r who; do
                [ -z "$who" ] && continue
                if [ "$1" = cb ]; then who="$(cb_from_line "$who")"; fi
                printf -- '- %s made their first contribution\n' "$who"
              done <<< "$new_contributors"
              echo
            fi
            if [ -n "$prev" ]; then
              echo "**Full Changelog**: https://codeberg.org/${CODEBERG_REPO}/compare/${prev}...${TAG}"
            fi
          }

          # Two bodies, chosen per host by release.yml. GitHub keeps the raw
          # `Name <email>` signature; Codeberg uses `@login` mentions.
          {
            echo "<!-- conjure:github -->"
            emit_body gh
            echo
            echo "<!-- conjure:codeberg -->"
            emit_body cb
          } > notes.md
          echo "wrote notes.md"

      - name: Bump Cargo.toml and Cargo.lock
        if: ${{ !inputs.dry_run }}
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          set -euo pipefail
          sed -i "0,/^version = \".*\"/s//version = \"${NEXT}\"/" Cargo.toml
          python3 - "$NEXT" <<'PY'
          import re, sys
          new = sys.argv[1]
          text = open("Cargo.lock").read()
          text, n = re.subn(
              r'(name = "conjure-build"\nversion = ")[^"]+(")',
              lambda m: m.group(1) + new + m.group(2),
              text,
          )
          if n != 1:
              raise SystemExit(f"expected 1 conjure-build entry in Cargo.lock, found {n}")
          open("Cargo.lock", "w").write(text)
          PY

      - name: Commit, tag, push to Codeberg
        if: ${{ !inputs.dry_run }}
        env:
          TAG: ${{ steps.version.outputs.tag }}
          NEXT: ${{ steps.version.outputs.next }}
          TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          set -euo pipefail
          git add Cargo.toml Cargo.lock
          # Releasing the current version unchanged (e.g. the first 0.1.0) leaves
          # nothing staged; only commit when the bump actually changed something.
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): ${TAG}"
          else
            echo "version unchanged; tagging ${TAG} without a commit"
          fi
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "tag ${TAG} already exists" >&2
            exit 1
          fi
          # Annotate with the notes (both per-host bodies, delimited by
          # `conjure:github` / `conjure:codeberg`), so the build workflow can
          # split them without regenerating anything. `--cleanup=verbatim`
          # keeps the leading `#` title, which git's default cleanup strips.
          git tag -a "$TAG" -F notes.md --cleanup=verbatim
          git remote add codeberg "https://h4rl:${TOKEN}@codeberg.org/${CODEBERG_REPO}.git"
          git push codeberg HEAD
          git push codeberg "$TAG"

      - name: Dry run summary
        if: ${{ inputs.dry_run }}
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          echo "Dry run: would tag ${TAG} and push to Codeberg with notes:"
          echo
          cat notes.md
